[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsign"
version = "0.1.0"
description = "Traffic sign and traffic light facts from dashcam video, with a threaded pipeline and CAN output"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Teja Chirravuri", email = "tejagana@gmail.com" }]
dependencies = ["numpy>=1.21", "opencv-python-headless>=4.5", "scikit-learn>=1.0", "joblib"]

[project.optional-dependencies]
can = ["python-can>=4.0"]
bench = ["psutil", "matplotlib>=3.5"]
dev = ["pytest>=7", "psutil", "matplotlib>=3.5"]

[project.scripts]
roadsign = "roadsign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
